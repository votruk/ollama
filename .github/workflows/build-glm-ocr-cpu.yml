name: Build GLM-OCR CPU image

on:
  workflow_dispatch:
  push:
    branches:
      - glm-ocr-fix-v0.32.14
    paths:
      - .github/workflows/build-glm-ocr-cpu.yml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ollama
  OLLAMA_VERSION: 0.32.14
  GLM_OCR_FIX_PR: 17195
  GLM_OCR_FIX_COMMIT: e6887700ebc4184e0f1a3265ec2499e48105bb1a

jobs:
  build-and-push:
    name: Build linux/amd64 CPU image
    runs-on: ubuntu-latest

    steps:
      - name: Check out stable Ollama branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply GLM-OCR EOT fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch the exact reviewed PR commit rather than the moving PR head.
          git fetch https://github.com/ollama/ollama.git "${GLM_OCR_FIX_COMMIT}"
          git cherry-pick "${GLM_OCR_FIX_COMMIT}"

          echo "Building Ollama ${OLLAMA_VERSION} with PR #${GLM_OCR_FIX_PR} (${GLM_OCR_FIX_COMMIT})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.OLLAMA_VERSION }}-glmocr-cpu
            type=raw,value=glmocr-cpu
          labels: |
            org.opencontainers.image.title=Ollama GLM-OCR CPU
            org.opencontainers.image.description=CPU-only Ollama ${{ env.OLLAMA_VERSION }} with GLM-OCR EOT fix from PR #${{ env.GLM_OCR_FIX_PR }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push CPU-only image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FLAVOR=publish-llama-server-cpu
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Published CPU-only Ollama image"
            echo
            echo "- \`ghcr.io/${IMAGE_NAME}:${OLLAMA_VERSION}-glmocr-cpu\`"
            echo "- \`ghcr.io/${IMAGE_NAME}:glmocr-cpu\`"
            echo "- Base: Ollama v${OLLAMA_VERSION}"
            echo "- GLM-OCR fix: ollama/ollama#${GLM_OCR_FIX_PR} @ \`${GLM_OCR_FIX_COMMIT}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Build flavor: \`publish-llama-server-cpu\` (no CUDA/ROCm/Vulkan/MLX payloads)"
          } >> "$GITHUB_STEP_SUMMARY"
